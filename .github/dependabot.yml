# Dependabot: monthly, grouped (one version PR + one security PR per ecosystem).
# Actions cost (Nov 2026): every Dependabot PR runs this repo's CI, so fewer, grouped PRs.
version: 2
updates:
- package-ecosystem: npm
  directory: /web
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  groups:
    npm-version:
      applies-to: version-updates
      patterns:
      - '*'
    npm-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: gomod
  directory: /agent
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  groups:
    gomod-version:
      applies-to: version-updates
      patterns:
      - '*'
    gomod-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  groups:
    github-actions-version:
      applies-to: version-updates
      patterns:
      - '*'
    github-actions-security:
      applies-to: security-updates
      patterns:
      - '*'
